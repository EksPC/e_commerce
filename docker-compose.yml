services:
  gateway:
    image: nginx:1.25-bookworm
    volumes:
      - ./gateway_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      order-service:
        condition: service_healthy
      stock-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      orchestrator-service:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Order Service
  # ---------------------------------------------------------------------------
  order-service:
    deploy:
      replicas: 1
    build: ./order
    volumes:
      - ./order:/home/flask-app/
      - ./services:/home/flask-app/services
    image: order:latest
    healthcheck:
      test:
        [
          "CMD", "python", "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/routes', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - GATEWAY_URL=http://gateway:80
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: gunicorn -k uvicorn.workers.UvicornWorker -b 0.0.0.0:5000 -w 2 --timeout 45 --config gunicorn.conf.py --log-level=info app:app
    env_file:
      - env/order_citus.env
      - env/kafka_settings.env
    depends_on:
      order-citus-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  order-consumer:
    deploy:
      replicas: 1
    build: ./order
    volumes:
      - ./order:/home/flask-app/
      - ./services:/home/flask-app/services
    image: order:latest
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: python consumer.py
    env_file:
      - env/order_citus.env
      - env/kafka_settings.env
    depends_on:
      order-citus-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      order-service:
        condition: service_healthy   # ensures schema exists before consumer starts

  order-producer:
    build: ./order
    volumes:
      - ./order:/home/flask-app/
      - ./services:/home/flask-app/services
    image: order:latest
    environment:
      - PYTHONUNBUFFERED=1
      - OUTBOX_POLL_INTERVAL=0.01s  # was 0.5 — reduces relay latency per saga step
    command: python producer.py
    env_file:
      - env/order_citus.env
      - env/kafka_settings.env
    depends_on:
      order-citus-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      # removed order-service dependency — producer only needs DB and Kafka

  order-citus-db:
    image: citusdata/citus:13.0
    command: postgres -c ssl=off -c shared_buffers=256MB -c work_mem=4MB
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=orders
    ports:
      - "5432:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
      - ./order/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    deploy:
      resources:
        limits:
          memory: 1G   # was 512M — too small for shared_buffers + working set
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------- 
  # Stock Service
  # ---------------------------------------------------------------------------
  stock-service:
    build: ./stock
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./stock:/home/flask-app/
      - ./services:/home/flask-app/services
    image: stock:latest
    healthcheck:
      test:
        [
          "CMD", "python", "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/items', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: gunicorn -k uvicorn.workers.UvicornWorker -b 0.0.0.0:5000 -w 6 --timeout 45 --config gunicorn.conf.py --log-level=info app:app
    env_file:
      - env/stock_citus.env
      - env/kafka_settings.env
    depends_on:
      stock-citus-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  stock-producer:
    build: ./stock
    volumes:
      - ./stock:/home/flask-app/
      - ./services:/home/flask-app/services
    image: stock:latest
    environment:
      - PYTHONUNBUFFERED=1
      - OUTBOX_POLL_INTERVAL=0.01s
    command: python producer.py
    env_file:
      - env/stock_citus.env
      - env/kafka_settings.env
    depends_on:
      stock-citus-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      # removed stock-service dependency — producer only needs DB and Kafka

  stock-consumer:
    deploy:
      replicas: 2 
    build: ./stock
    volumes:
      - ./stock:/home/flask-app/
      - ./services:/home/flask-app/services
    image: stock:latest
    environment:
      - PYTHONUNBUFFERED=1
    command: python consumer.py
    env_file:
      - env/stock_citus.env
      - env/kafka_settings.env
    depends_on:
      stock-citus-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      stock-service:
        condition: service_healthy   # ensures schema exists before consumer starts

  stock-citus-db:
    image: citusdata/citus:13.0
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=stocks
    command: postgres -c ssl=off -c shared_buffers=256MB -c work_mem=4MB
    ports:
      - "5433:5432"
    volumes:
      - stock_db_data:/var/lib/postgresql/data
      - ./stock/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Payment Service
  # ---------------------------------------------------------------------------
  payment-service:
    build: ./payment
    volumes:
      - ./payment:/home/flask-app/
      - ./services:/home/flask-app/services
    image: payment:latest
    healthcheck:
      test:
        [
          "CMD", "python", "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/users', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: gunicorn -k uvicorn.workers.UvicornWorker -b 0.0.0.0:5000 -w 2 --timeout 45 --config gunicorn.conf.py --log-level=info app:app
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - env/payment_citus.env
      - env/kafka_settings.env
    depends_on:
      payment-citus-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  payment-producer:
    build: ./payment
    volumes:
      - ./payment:/home/flask-app/
      - ./services:/home/flask-app/services
    image: payment:latest
    command: python producer.py
    environment:
      - PYTHONUNBUFFERED=1
      - OUTBOX_POLL_INTERVAL=0.01s
    env_file:
      - env/payment_citus.env
      - env/kafka_settings.env
    depends_on:
      payment-citus-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      # removed payment-service dependency — producer only needs DB and Kafka

  payment-consumer:

    deploy:
      replicas: 2
    build: ./payment
    volumes:
      - ./payment:/home/flask-app/
      - ./services:/home/flask-app/services
    image: payment:latest
    command: python consumer.py
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - env/payment_citus.env
      - env/kafka_settings.env
    depends_on:
      payment-citus-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      payment-service:
        condition: service_healthy   # ensures schema exists before consumer starts

  payment-citus-db:
    image: citusdata/citus:13.0
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=payments
    command: postgres -c ssl=off -c shared_buffers=256MB -c work_mem=4MB
    ports:
      - "5434:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
      - ./payment/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Orchestrator
  # ---------------------------------------------------------------------------
  orchestrator-service:
    build: ./orchestrator
    volumes:
      - ./orchestrator:/home/flask-app/
      - ./services:/home/flask-app/services
    image: orchestrator:latest
    healthcheck:
      test:
        [
          "CMD", "python", "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: gunicorn -k uvicorn.workers.UvicornWorker -b 0.0.0.0:5000 -w 2 --timeout 45 --config gunicorn.conf.py --log-level=info app:app
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - env/orchestrator_citus.env
      - env/kafka_settings.env
    depends_on:
      orchestrator-pgbouncer:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  orchestrator-consumer:
    build: ./orchestrator
    volumes:
      - ./orchestrator:/home/flask-app/
      - ./services:/home/flask-app/services
    image: orchestrator:latest
    command: python consumer.py
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - env/orchestrator_citus.env
      - env/kafka_settings.env
    deploy:
      replicas: 1
    depends_on:
      orchestrator-pgbouncer:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      orchestrator-service:
        condition: service_healthy   # ensures schema exists before consumer starts

  orchestrator-producer:
    build: ./orchestrator
    volumes:
      - ./orchestrator:/home/flask-app/
      - ./services:/home/flask-app/services
    image: orchestrator:latest
    command: python producer.py
    environment:
      - PYTHONUNBUFFERED=1
      - OUTBOX_POLL_INTERVAL=0.01s
    env_file:
      - env/orchestrator_citus.env
      - env/kafka_settings.env
    depends_on:
      orchestrator-pgbouncer:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      # removed orchestrator-service dependency — producer only needs DB and Kafka




  orchestrator-citus-db:
    image: citusdata/citus:13.0
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=orchestrator
    command: postgres -c ssl=off -c shared_buffers=512MB -c work_mem=8MB -c max_connections=200
    ports:
      - "5435:5432"
    volumes:
      - orchestrator_db_data:/var/lib/postgresql/data
      - ./orchestrator/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    container_name: kafka
    
    ports:
      - "9092:9092"
    environment:
    
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
      
  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - >-
        echo 'Waiting for Kafka broker to be fully ready...' &&
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
          echo 'Not ready yet, retrying in 2s...';
          sleep 10;
        done &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orchestrator.request --partitions 20 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic stock.request --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.request --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order.request --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orchestrator.dead_letter --partitions 1 --replication-factor 1 &&
        sleep 5 &&
        echo 'All topics created:' &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  orchestrator-pgbouncer:
    image: edoburu/pgbouncer:latest
    volumes:
      - ./pgbouncer/orchestrator-pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      orchestrator-citus-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kafka_data:
  order_db_data:
  stock_db_data:
  payment_db_data:
  orchestrator_db_data:

